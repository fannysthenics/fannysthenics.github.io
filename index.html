
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">

  <title>Fannysthenics</title>

  <style>
    :root {
      --black: #080808;
      --white: #f4f0ed;
      --purple: #bd86ff;
      --grey: #85818a;
      --border: #29252e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(100% - 36px, 480px);
      margin: 0 auto;
    }

    /* LOGO */

    header {
      padding: 65px 0 48px;
      text-align: center;
    }

    .logo {
      display: inline-block;
      font-size: clamp(30px, 8vw, 43px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: -2px;
      line-height: 1.15;
      white-space: nowrap;
    }

    .logo .fanny {
      color: var(--purple);
    }

    .logo .sthenics {
      color: var(--white);
    }

.logo-star {
  color: #f4f0ed;
  font-size: 13px;
  display: inline-block;
  vertical-align: top;
  margin-left: -7px;
  margin-top: 1px;
  position: relative;
  left: -1px;
}


    /* DERNIÈRE VIDÉO */

    section {
      margin-bottom: 36px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 15px;
      letter-spacing: 0.1px;
    }

    .video {
      display: block;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
      position: relative;
    }

    .video img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      transition: opacity 0.2s;
    }

    .video:hover img {
      opacity: 0.8;
    }

    .play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--purple);
      color: var(--black);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      font-size: 19px;
      padding-left: 3px;
    }

    /* PROFIL */

    .profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 40px 0 25px;
    }

    .profile img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--purple);
    }

    .username {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    /* RÉSEAUX */

    .socials {
      display: grid;
      gap: 11px;
    }

    .social {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px;
      min-height: 58px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #101010;
      transition:
        border-color 0.2s,
        background 0.2s,
        transform 0.2s;
    }

    .social:hover {
      border-color: var(--purple);
      background: #17121d;
      transform: translateY(-1px);
    }

    .social-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .social-icon {
      color: var(--purple);
      width: 23px;
      text-align: center;
      font-size: 19px;
      font-weight: 700;
    }

    .social-name {
      font-size: 14px;
      font-weight: 600;
    }

    .arrow {
      color: var(--grey);
      font-size: 18px;
    }

    /* CONTACT */

    .contact {
      margin-top: 42px;
      margin-bottom: 55px;
    }

    .email {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      overflow-wrap: anywhere;
      transition: border-color 0.2s;
    }

    .email:hover {
      border-color: var(--purple);
    }

    .email-icon {
      color: var(--purple);
      font-size: 19px;
    }

    @media (max-width: 380px) {
      header {
        padding-top: 50px;
      }

      .logo {
        letter-spacing: -1.5px;
      }

      .email {
        font-size: 12px;
      }
    }
  </style>
</head>
